name: Reddit to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reddit-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python3 -m pip install requests

      - name: Reddit to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@PESMobileupdates"
        run: |
          python3 <<'PY'
          import os
          import json
          import requests

          REDDIT_URL = "https://www.reddit.com/r/pesmobile/new.json?limit=10"
          STATE_FILE = ".reddit_last_post"

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHANNEL = os.environ["TELEGRAM_CHANNEL"]

          headers = {
              "User-Agent": "PESMobileTelegramBot/1.0"
          }

          # Get Reddit posts
          response = requests.get(
              REDDIT_URL,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          reddit = response.json()
          posts = reddit["data"]["children"]

          if not posts:
              print("No Reddit posts found.")
              raise SystemExit(0)

          # Read last processed post
          last_id = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r") as f:
                  last_id = f.read().strip()

          newest_id = posts[0]["data"]["id"]

          # If this is the first run, send only the newest post
          if not last_id:
              posts_to_send = [posts[0]]

          else:
              posts_to_send = []

              for post in posts:
                  post_id = post["data"]["id"]

                  if post_id == last_id:
                      break

                  posts_to_send.append(post)

              posts_to_send.reverse()

          # Nothing new
          if not posts_to_send:
              print("No new Reddit posts.")
              raise SystemExit(0)

          def telegram(method, data=None, files=None):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/{method}"

              r = requests.post(
                  url,
                  data=data,
                  files=files,
                  timeout=120
              )

              print(method, r.status_code, r.text)

              r.raise_for_status()

              return r.json()

          for item in posts_to_send:

              data = item["data"]

              post_id = data["id"]
              title = data.get("title", "New r/pesmobile post")
              permalink = "https://www.reddit.com" + data.get(
                  "permalink", ""
              )

              caption = (
                  "🆕 <b>r/pesmobile</b>\n\n"
                  f"<b>{title}</b>\n\n"
                  f"🔗 <a href=\"{permalink}\">View Reddit post</a>"
              )

              media_sent = False

              # ----------------------------------------
              # 1. Reddit native video
              # ----------------------------------------

              secure_media = data.get("secure_media")

              if secure_media:
                  reddit_video = secure_media.get("reddit_video")

                  if reddit_video:
                      video_url = reddit_video.get("fallback_url")

                      if video_url:

                          print("Downloading Reddit video:")
                          print(video_url)

                          video_response = requests.get(
                              video_url,
                              headers=headers,
                              timeout=120
                          )

                          video_response.raise_for_status()

                          video_size = len(video_response.content)

                          # Telegram video limit
                          if video_size <= 50 * 1024 * 1024:

                              files = {
                                  "video": (
                                      "reddit_video.mp4",
                                      video_response.content,
                                      "video/mp4"
                                  )
                              }

                              telegram(
                                  "sendVideo",
                                  data={
                                      "chat_id": CHANNEL,
                                      "caption": caption,
                                      "parse_mode": "HTML",
                                      "supports_streaming": "true"
                                  },
                                  files=files
                              )

                              media_sent = True

                          else:
                              print(
                                  "Video is larger than Telegram's "
                                  "50 MB bot limit."
                              )

              # ----------------------------------------
              # 2. Reddit gallery
              # ----------------------------------------

              if not media_sent and data.get("is_gallery"):

                  media_metadata = data.get(
                      "media_metadata",
                      {}
                  )

                  gallery_images = []

                  for media_id, media in media_metadata.items():

                      if media.get("status") != "valid":
                          continue

                      image_data = media.get("s", {})

                      image_url = image_data.get("u")

                      if image_url:
                          image_url = image_url.replace(
                              "&amp;",
                              "&"
                          )

                          gallery_images.append(image_url)

                  for image_url in gallery_images:

                      print("Downloading gallery image:")
                      print(image_url)

                      image_response = requests.get(
                          image_url,
                          headers=headers,
                          timeout=60
                      )

                      image_response.raise_for_status()

                      image_size = len(
                          image_response.content
                      )

                      if image_size <= 10 * 1024 * 1024:

                          files = {
                              "photo": (
                                  "reddit_image.jpg",
                                  image_response.content,
                                  "image/jpeg"
                              )
                          }

                          telegram(
                              "sendPhoto",
                              data={
                                  "chat_id": CHANNEL,
                                  "caption": caption,
                                  "parse_mode": "HTML"
                              },
                              files=files
                          )

                          # Caption only on first image
                          caption = ""

                          media_sent = True

              # ----------------------------------------
              # 3. Direct Reddit image
              # ----------------------------------------

              if not media_sent:

                  image_url = data.get("url_overridden_by_dest", "")

                  if (
                      image_url.startswith(
                          "https://i.redd.it/"
                      )
                      or image_url.startswith(
                          "https://preview.redd.it/"
                      )
                  ):

                      print("Downloading Reddit image:")
                      print(image_url)

                      image_response = requests.get(
                          image_url,
                          headers=headers,
                          timeout=60
                      )

                      image_response.raise_for_status()

                      image_size = len(
                          image_response.content
                      )

                      if image_size <= 10 * 1024 * 1024:

                          files = {
                              "photo": (
                                  "reddit_image.jpg",
                                  image_response.content,
                                  "image/jpeg"
                              )
                          }

                          telegram(
                              "sendPhoto",
                              data={
                                  "chat_id": CHANNEL,
                                  "caption": caption,
                                  "parse_mode": "HTML"
                              },
                              files=files
                          )

                          media_sent = True

              # ----------------------------------------
              # 4. Text/link post
              # ----------------------------------------

              if not media_sent:

                  telegram(
                      "sendMessage",
                      data={
                          "chat_id": CHANNEL,
                          "text": caption,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": "false"
                      }
                  )

              print(
                  f"Successfully processed Reddit post: {post_id}"
              )

          # Save newest Reddit post
          with open(STATE_FILE, "w") as f:
              f.write(newest_id)

          print("Finished successfully.")
          PY

      - name: Save Reddit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .reddit_last_post

          git diff --cached --quiet || \
            git commit -m "Update Reddit post tracker"

          git push
