name: Reddit to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reddit-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python3 -m pip install requests beautifulsoup4

      - name: Reddit to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@PESMobileupdates"
        run: |
          python3 <<'PY'
          import os
          import re
          import html
          import requests
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup

          FEED_URL = "https://www.reddit.com/r/pesmobile/new/.rss"
          STATE_FILE = ".reddit_last_post"

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHANNEL = os.environ["TELEGRAM_CHANNEL"]

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) RedditRSSBot/1.0"
          }

          # --------------------------------------------------
          # Get Reddit RSS/Atom feed
          # --------------------------------------------------

          response = requests.get(
              FEED_URL,
              headers=headers,
              timeout=30
          )

          print("Reddit status:", response.status_code)

          response.raise_for_status()

          root = ET.fromstring(response.content)

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entries = root.findall("atom:entry", ns)

          print("Posts found:", len(entries))

          if not entries:
              print("No Reddit posts found.")
              raise SystemExit(0)

          # --------------------------------------------------
          # Read previous post
          # --------------------------------------------------

          last_id = ""

          if os.path.exists(STATE_FILE):
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  last_id = f.read().strip()

          # --------------------------------------------------
          # Determine new posts
          # --------------------------------------------------

          newest_id = entries[0].findtext(
              "atom:id",
              "",
              ns
          )

          if not last_id:
              # First run = only send newest post
              new_entries = [entries[0]]

          else:
              new_entries = []

              for entry in entries:

                  entry_id = entry.findtext(
                      "atom:id",
                      "",
                      ns
                  )

                  if entry_id == last_id:
                      break

                  new_entries.append(entry)

              new_entries.reverse()

          if not new_entries:
              print("No new Reddit posts.")
              raise SystemExit(0)

          print("New posts:", len(new_entries))

          # --------------------------------------------------
          # Telegram helper
          # --------------------------------------------------

          def telegram(method, data=None, files=None):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{BOT_TOKEN}/{method}"
              )

              result = requests.post(
                  url,
                  data=data,
                  files=files,
                  timeout=120
              )

              print(
                  "Telegram:",
                  method,
                  result.status_code
              )

              if not result.ok:
                  print(result.text)

              result.raise_for_status()

              return result.json()

          # --------------------------------------------------
          # Process Reddit posts
          # --------------------------------------------------

          for entry in new_entries:

              title = entry.findtext(
                  "atom:title",
                  "New r/pesmobile post",
                  ns
              )

              post_id = entry.findtext(
                  "atom:id",
                  "",
                  ns
              )

              # Reddit post link
              link_element = entry.find(
                  "atom:link",
                  ns
              )

              reddit_link = ""

              if link_element is not None:
                  reddit_link = link_element.attrib.get(
                      "href",
                      ""
                  )

              # Atom content
              content_element = entry.find(
                  "atom:content",
                  ns
              )

              content_html = ""

              if content_element is not None:
                  content_html = (
                      "".join(
                          content_element.itertext()
                      )
                  )

              # ------------------------------------------------
              # Find media URLs
              # ------------------------------------------------

              media_urls = []

              # Find direct i.redd.it links
              direct_images = re.findall(
                  r'https?://i\.redd\.it/[^\s"<>&]+',
                  content_html
              )

              for url in direct_images:
                  url = html.unescape(url)

                  if url not in media_urls:
                      media_urls.append(url)

              # Find v.redd.it video links
              video_urls = re.findall(
                  r'https?://v\.redd\.it/[^\s"<>&]+',
                  content_html
              )

              for url in video_urls:
                  url = html.unescape(url)

                  if url not in media_urls:
                      media_urls.append(url)

              # Also inspect HTML links
              soup = BeautifulSoup(
                  content_html,
                  "html.parser"
              )

              for a in soup.find_all("a"):

                  href = a.get("href", "")

                  if (
                      "i.redd.it/" in href
                      or "v.redd.it/" in href
                  ):

                      href = html.unescape(href)

                      if href not in media_urls:
                          media_urls.append(href)

              print("Media found:", media_urls)

              caption = (
                  "🆕 <b>r/pesmobile</b>\n\n"
                  f"<b>{html.escape(title)}</b>\n\n"
                  f"🔗 <a href=\"{html.escape(reddit_link, quote=True)}\">"
                  f"View Reddit post</a>"
              )

              media_sent = False

              # ------------------------------------------------
              # Try each media URL
              # ------------------------------------------------

              for media_url in media_urls:

                  try:

                      print(
                          "Downloading:",
                          media_url
                      )

                      media_response = requests.get(
                          media_url,
                          headers=headers,
                          timeout=120
                      )

                      if not media_response.ok:
                          print(
                              "Download failed:",
                              media_response.status_code
                          )
                          continue

                      media = media_response.content

                      content_type = (
                          media_response.headers
                          .get("content-type", "")
                          .lower()
                      )

                      # ------------------------------------------
                      # IMAGE
                      # ------------------------------------------

                      if (
                          "image/" in content_type
                          or ".jpg" in media_url.lower()
                          or ".jpeg" in media_url.lower()
                          or ".png" in media_url.lower()
                          or ".webp" in media_url.lower()
                      ):

                          # Telegram upload limit for photos
                          if len(media) <= 10 * 1024 * 1024:

                              telegram(
                                  "sendPhoto",
                                  data={
                                      "chat_id": CHANNEL,
                                      "caption": caption,
                                      "parse_mode": "HTML"
                                  },
                                  files={
                                      "photo": (
                                          "reddit_image.jpg",
                                          media,
                                          content_type or "image/jpeg"
                                      )
                                  }
                              )

                              media_sent = True
                              break

                      # ------------------------------------------
                      # VIDEO
                      # ------------------------------------------

                      elif (
                          "video/" in content_type
                          or "v.redd.it/" in media_url
                          or ".mp4" in media_url.lower()
                      ):

                          # Telegram bot upload limit
                          if len(media) <= 50 * 1024 * 1024:

                              telegram(
                                  "sendVideo",
                                  data={
                                      "chat_id": CHANNEL,
                                      "caption": caption,
                                      "parse_mode": "HTML",
                                      "supports_streaming": "true"
                                  },
                                  files={
                                      "video": (
                                          "reddit_video.mp4",
                                          media,
                                          "video/mp4"
                                      )
                                  }
                              )

                              media_sent = True
                              break

                  except Exception as error:

                      print(
                          "Media error:",
                          str(error)
                      )

              # ------------------------------------------------
              # If no media, send text post
              # ------------------------------------------------

              if not media_sent:

                  telegram(
                      "sendMessage",
                      data={
                          "chat_id": CHANNEL,
                          "text": caption,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": "false"
                      }
                  )

              print(
                  "Processed:",
                  post_id
              )

          # --------------------------------------------------
          # Save newest post
          # --------------------------------------------------

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(newest_id)

          print("Done.")
          PY

      - name: Save Reddit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .reddit_last_post

          git diff --cached --quiet || \
            git commit -m "Update Reddit post tracker"

          git push
